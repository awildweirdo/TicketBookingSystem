<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Booking</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
    
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --secondary: #94a3b8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-light: #94a3b8;
            --available: #10b981;
            --held: #f59e0b;
            --booked: #ef4444;
            --disabled: #334155;
            --nav-bg: #0b1120;
        }

        .hidden { display: none; }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }

        .nav { 
            background-color: rgba(11, 17, 32, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 30px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav a { 
            color: var(--text-light); 
            font-weight: 500; 
            padding: 8px 16px; 
            border-radius: 8px; 
            text-decoration: none; 
            transition: all 0.2s ease; 
        }
        .nav a:hover, .nav a.active { 
            background-color: rgba(99, 102, 241, 0.15); 
            color: #ffffff; 
        }
        .nav-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; align-items: center; gap: 12px; }

        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 32px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border-color);
            margin-bottom: 32px; 
        }
        h2 { color: #ffffff; font-weight: 600; margin-top: 0; margin-bottom: 24px; font-size: 28px; letter-spacing: -0.02em; }
        h3 { color: #e2e8f0; font-weight: 500; }
        
        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 500; 
            transition: all 0.2s ease; 
            font-family: inherit;
            width: 100%;
        }
        button:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        button.danger { background-color: var(--booked); }
        button.danger:hover { background-color: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        
        input, select, textarea { 
            padding: 12px 16px; 
            background-color: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 20px; 
            font-family: inherit; 
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); 
        }
        
        .auth-container { max-width: 420px; margin: 80px auto; }
        
        .seat { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 48px; 
            height: 48px; 
            margin: 6px; 
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .seat:hover { transform: scale(1.1); z-index: 10; position: relative; }
        .seat.available { background: rgba(16, 185, 129, 0.15); color: var(--available); border: 2px solid rgba(16, 185, 129, 0.5); }
        .seat.held { background: rgba(245, 158, 11, 0.15); color: var(--held); border: 2px solid rgba(245, 158, 11, 0.5); }
        .seat.booked { background: rgba(239, 68, 68, 0.15); color: var(--booked); cursor: not-allowed; border: 2px solid rgba(239, 68, 68, 0.5); }
        .seat.disabled { background: var(--disabled); color: #64748b; cursor: not-allowed; border: 2px solid #1e293b; }
        .seat.selected { background: var(--primary); color: white; border: 2px solid var(--primary-hover); box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
        
        .seat-map-container { 
            background: #0b1120; 
            padding: 32px; 
            border-radius: 16px; 
            display: inline-block; 
            margin-bottom: 24px; 
            border: 1px solid var(--border-color); 
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.2);
            width: 100%;
            overflow-x: auto;
            box-sizing: border-box;
        }
        .panel-split { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
        @media (max-width: 900px) { .panel-split { grid-template-columns: 1fr; } }
        
        .error { color: var(--booked); font-weight: 500; }
        
        .screen-indicator {
            text-align: center;
            margin: 0 auto 30px auto;
            padding: 15px 0;
            background: linear-gradient(180deg, rgba(99,102,241,0.2) 0%, transparent 100%);
            border-top: 4px solid var(--primary);
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            width: 90%;
            box-shadow: 0 -10px 20px rgba(99,102,241,0.1);
        }

        .poster-large {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-top: 16px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .event-card {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .event-card:hover {
            border-color: var(--primary);
            background: var(--card-bg);
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3), 0 10px 10px -5px rgba(0,0,0,0.2);
        }

        .event-card .poster-thumb {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 0;
            border: none;
            transition: transform 0.5s ease;
        }
        .event-card:hover .poster-thumb {
            transform: scale(1.05);
        }

        .event-card .poster-placeholder {
            width: 100%;
            height: 380px;
            border-radius: 0;
            border: none;
            border-bottom: 1px solid var(--border-color);
        }

        .event-info {
            padding: 20px;
            flex: 1;
            z-index: 1;
            background: linear-gradient(0deg, var(--card-bg) 0%, rgba(30,41,59,0.9) 100%);
        }
        .event-info p { margin: 8px 0; color: var(--text-light); font-size: 14px; }
        .event-info h3 { color: #ffffff; margin-top: 0; font-size: 22px; margin-bottom: 16px; font-weight: 700; }
        
        .event-actions {
            padding: 0 20px 20px 20px;
            display: flex;
            gap: 12px;
            z-index: 1;
            background: var(--card-bg);
        }

        /* List style for bookings page */
        .booking-card {
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            background: rgba(30, 41, 59, 0.5);
            transition: all 0.2s ease;
        }
        .booking-card:hover {
            border-color: var(--primary);
            background: var(--card-bg);
        }
        .booking-card .poster-thumb {
            width: 80px;
            height: 112px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .booking-card .poster-placeholder {
            width: 80px;
            height: 112px;
            border-radius: 8px;
            font-size: 24px;
        }
        .booking-card button { width: auto; }
</style>
</head>
<body>
    <div class="nav">
        <div class="nav-content">
            <div class="nav-links">
                <a href="#events" style="font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: -0.03em; margin-right: 8px; display: flex; align-items: center; gap: 8px; padding: 0;">
                    🎫 <span>TicketVault</span>
                </a>
                <a href="#events">Events</a>
                <span id="nav-user-left" class="hidden" style="display: flex; align-items: center; gap: 15px;">
                    <a href="#my-bookings">My Bookings</a>
                    <span id="nav-admin" class="hidden"><a href="#admin">Admin</a></span>
                    <span id="nav-organiser" class="hidden"><a href="#organiser">Organiser</a></span>
                </span>
            </div>
            
            <div class="nav-links">
                <span id="nav-user-right" class="hidden" style="display: flex; align-items: center; gap: 15px;">
                    <span style="color: #f8fafc; display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 1.2em;">👤</span> <span id="user-email-display"></span>
                    </span>
                    <a href="#logout" id="logout-btn">Logout</a>
                </span>
                <span id="nav-guest" style="display: flex; align-items: center; gap: 15px;">
                    <a href="#login">Login</a>
                    <a href="#register">Register</a>
                </span>
            </div>
        </div>
    </div>
    <div id="app" class="container"></div>

    <script>
        const app = document.getElementById('app');
        let token = localStorage.getItem('token');
        let userId = localStorage.getItem('userId');
        let role = localStorage.getItem('role');
        let email = localStorage.getItem('email');
        
        function updateNav() {
            if (token) {
                document.getElementById('nav-user-left').style.display = 'flex';
                document.getElementById('nav-user-right').style.display = 'flex';
                document.getElementById('user-email-display').innerText = email;
                document.getElementById('nav-guest').style.display = 'none';
                if (role === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
                else document.getElementById('nav-admin').classList.add('hidden');
                if (role === 'organiser' || role === 'admin') document.getElementById('nav-organiser').classList.remove('hidden');
                else document.getElementById('nav-organiser').classList.add('hidden');
            } else {
                document.getElementById('nav-user-left').style.display = 'none';
                document.getElementById('nav-user-right').style.display = 'none';
                document.getElementById('nav-guest').style.display = 'flex';
            }
        }
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.clear(); token = null; email = null; updateNav(); window.location.hash = '#events';
        });

        async function api(path, method = 'GET', body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        window.deleteEvent = async function(eventId) {
            if (!confirm('Are you sure you want to permanently delete this event and all associated bookings?')) return;
            try {
                await api(`/api/events/${eventId}`, 'DELETE');
                alert('Event deleted successfully.');
                renderEvents();
            } catch (e) { alert(e.message); }
        };

        function renderEvents() {
            app.innerHTML = `
            <div style="text-align:center; padding: 60px 20px 40px; background: linear-gradient(180deg, rgba(99,102,241,0.08) 0%, transparent 100%); margin: -32px -20px 40px; border-bottom: 1px solid var(--border-color);">
                <div style="font-size:13px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--primary); margin-bottom:12px;">Now Showing & Coming Soon</div>
                <h1 style="font-size: clamp(28px, 5vw, 48px); font-weight: 800; margin: 0 0 12px; background: linear-gradient(135deg, #ffffff 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.03em;">Featured Events</h1>
                <p style="color: var(--text-light); font-size: 16px; margin: 0;">Pick your seats, book your moment.</p>
            </div>
            <div id="events-list" class="events-grid">Loading...</div>`;
            Promise.all([api('/api/events'), api('/api/venues')]).then(([eventsData, venuesData]) => {
                const venuesMap = {};
                if (venuesData.venues) venuesData.venues.forEach(v => venuesMap[v.id] = v.name);
                
                const list = eventsData.events.map(e => `<div class="event-card">
                    ${e.poster_url ? `<img src="${e.poster_url}" alt="${e.title} poster" class="poster-thumb">` : `<div class="poster-placeholder">🎬</div>`}
                    <div class="event-info">
                        <h3>${e.title} <small style="color:#94a3b8; font-size:14px; font-weight:normal;">(${e.event_type})</small></h3>
                        <p>📍 ${venuesMap[e.venue_id] || 'Unknown'}</p>
                        <p>🕒 ${e.starts_at}</p>
                    </div>
                    <div class="event-actions">
                        <button onclick="window.location.hash='#event-${e.id}'">Book Now</button>
                        ${role === 'admin' ? `<button onclick="deleteEvent(${e.id})" class="danger">Delete</button>` : ''}
                    </div>
                </div>`).join('');
                document.getElementById('events-list').innerHTML = list || '<p style="margin-left:20px;">No events currently scheduled.</p>';
            }).catch(e => { document.getElementById('events-list').innerHTML = `<p class="error" style="margin-left:20px;">${e.message}</p>`; });
        }

        let pollInterval;
        let selectedSeats = [];
        function renderEventSeats(eventId) {
            app.innerHTML = `
                <div style="margin-bottom: 16px;">
                    <a href="#events" style="color:var(--text-light); text-decoration:none; font-size:14px; display:inline-flex; align-items:center; gap:6px; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color=''">← Back to Events</a>
                </div>
                <div class="panel-split">
                    <div class="card">
                        <h2 id="seat-page-title" style="font-size:22px;">Loading seats...</h2>
                        <div class="seat-map-container"><div id="seat-map">Loading...</div></div>
                        <div id="actions"></div>
                        <div id="waitlist-actions" style="margin-top: 20px;"></div>
                    </div>
                    <div class="card" id="event-details-panel" style="align-self: start; position: sticky; top: 90px;">
                        <p style="color:var(--text-light);">Loading details...</p>
                    </div>
                </div>
            `;
            
            // Load event details for the right panel
            Promise.all([api('/api/events'), api('/api/venues')]).then(([eventsData, venuesData]) => {
                const ev = eventsData.events.find(e => e.id == eventId);
                const vName = venuesData.venues ? venuesData.venues.find(v => v.id == ev.venue_id)?.name : '';
                const titleEl = document.getElementById('seat-page-title');
                if (titleEl) titleEl.textContent = ev ? ev.title : `Event ${eventId} Seats`;
                if(ev) {
                    document.getElementById('event-details-panel').innerHTML = `
                        ${ev.poster_url ? `<img src="${ev.poster_url}" class="poster-large" alt="${ev.title} poster" style="margin-top:0; margin-bottom:20px;">` : ''}
                        <h3 style="margin-top:0;">${ev.title}</h3>
                        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
                            <div style="display:flex; justify-content:space-between; font-size:14px;">
                                <span style="color:var(--text-light);">Type</span>
                                <span style="text-transform:capitalize; font-weight:500;">${ev.event_type}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:14px;">
                                <span style="color:var(--text-light);">Date & Time</span>
                                <span style="font-weight:500;">${ev.starts_at}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:14px;">
                                <span style="color:var(--text-light);">Venue</span>
                                <span style="font-weight:500;">${vName || ev.venue_id}</span>
                            </div>
                        </div>
                        <div style="border-top:1px solid var(--border-color); padding-top:16px;">
                            <p style="font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--text-light); margin:0 0 12px;">How to Book</p>
                            <p style="font-size:13px; color:var(--text-light); margin:0; line-height:1.6;">Click a <span style="color:#10b981; font-weight:600;">green</span> seat to select it, then press <strong style="color:#fff;">Hold Selected Seats</strong>. You'll have 10 minutes to confirm your booking.</p>
                        </div>
                    `;
                }
            });

            window.loadSeats = () => {
                api(`/api/events/${eventId}/seats`).then(data => {
                    // Determine grid dimensions
                    let maxRow = 0, maxCol = 0;
                    data.seats.forEach(s => {
                        if (s.row_number > maxRow) maxRow = s.row_number;
                        if (s.column_number > maxCol) maxCol = s.column_number;
                    });
                    
                    // Build a lookup map
                    const seatMap = {};
                    data.seats.forEach(s => { seatMap[s.row_number + '-' + s.column_number] = s; });

                    const categoryCounts = {};
                    let mapHtml = '<div class="screen-indicator">SCREEN</div>';
                    mapHtml += `<div style="display:grid; grid-template-columns: 28px repeat(${maxCol}, 48px); gap: 6px; justify-content: center; align-items: center;">`;
                    
                    for (let r = 1; r <= maxRow; r++) {
                        // Row label
                        mapHtml += `<div style="color:var(--text-light); font-size:12px; font-weight:600; text-align:center;">${String.fromCharCode(64+r)}</div>`;
                        for (let c = 1; c <= maxCol; c++) {
                            const s = seatMap[r + '-' + c];
                            if (s) {
                                let cls = s.status;
                                if (selectedSeats.includes(s.id)) cls += ' selected';
                                mapHtml += `<div class="seat ${cls}" onclick="toggleSeat('${s.id}', '${s.status}')" title="${s.category} ${s.id} — $${s.price_cents/100}">${s.id}</div>`;
                                
                                if (!categoryCounts[s.category]) categoryCounts[s.category] = { total: 0, available: 0 };
                                categoryCounts[s.category].total++;
                                if (s.status === 'available') categoryCounts[s.category].available++;
                            } else {
                                mapHtml += '<div class="seat" style="visibility:hidden;"></div>';
                            }
                        }
                    }
                    mapHtml += '</div>';
                    // Legend
                    mapHtml += `<div style="display:flex; gap:16px; justify-content:center; margin-top:24px; flex-wrap:wrap;">
                        <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);"><span style="width:14px;height:14px;border-radius:4px;background:rgba(16,185,129,0.3);border:2px solid #10b981;display:inline-block;"></span>Available</span>
                        <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);"><span style="width:14px;height:14px;border-radius:4px;background:var(--primary);display:inline-block;"></span>Selected</span>
                        <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);"><span style="width:14px;height:14px;border-radius:4px;background:rgba(245,158,11,0.3);border:2px solid #f59e0b;display:inline-block;"></span>Held</span>
                        <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);"><span style="width:14px;height:14px;border-radius:4px;background:rgba(239,68,68,0.3);border:2px solid #ef4444;display:inline-block;"></span>Booked</span>
                    </div>`;
                    document.getElementById('seat-map').innerHTML = mapHtml;

                    // Waitlist UI
                    let waitlistHtml = '<h3>Waitlist</h3><p>If a category is sold out, join the waitlist!</p>';
                    let hasSoldOut = false;
                    Object.keys(categoryCounts).forEach(cat => {
                        if (categoryCounts[cat].available === 0 && categoryCounts[cat].total > 0) {
                            hasSoldOut = true;
                        }
                    });
                    if (hasSoldOut) {
                        waitlistHtml += '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px;">';
                        waitlistHtml += '<label style="color:var(--text-light);">Seats: <input type="number" id="waitlistCount" value="1" min="1" style="width:60px; background:var(--nav-bg); color:var(--text-main); border:1px solid var(--border-color); border-radius:6px; padding:8px; margin:0;"></label>';
                        Object.keys(categoryCounts).forEach(cat => {
                            if (categoryCounts[cat].available === 0 && categoryCounts[cat].total > 0) {
                                waitlistHtml += `<button onclick="joinWaitlist(${eventId}, '${cat}')">Join ${cat} Waitlist</button> `;
                            }
                        });
                        waitlistHtml += '</div>';
                    } else {
                        waitlistHtml += '<p style="color:var(--text-light); font-style:italic;">All categories have seats available.</p>';
                    }

                    document.getElementById('waitlist-actions').innerHTML = waitlistHtml;

                    let actionsHtml = '';
                    if (selectedSeats.length > 0) {
                        actionsHtml += `<button onclick="holdSelectedSeats(${eventId})">Hold Selected Seats</button>`;
                    }
                    if (token && data.seats.some(s => s.status === 'held')) {
                        actionsHtml += `<button onclick="confirmHeldSeats(${eventId})">Confirm Held Seats</button>`;
                    }
                    document.getElementById('actions').innerHTML = actionsHtml;


                }).catch(e => console.error(e));
            };
            loadSeats();
            pollInterval = setInterval(loadSeats, 5000);
        }

        
        window.joinWaitlist = async function(eventId, category) {
            if (!token) return alert('Please login first');
            const count = parseInt(document.getElementById('waitlistCount').value) || 1;
            try {
                await api(`/api/events/${eventId}/waitlist`, 'POST', { category, count });
                alert(`Successfully joined the waitlist for ${count} seat(s) in ${category}! You will be emailed.`);
            } catch (e) { alert(e.message); }
        };


        
        window.toggleSeat = function(seatId, status) {
            if (!token) return alert('Please login first');
            if (status !== 'available') return;
            const idx = selectedSeats.indexOf(seatId);
            if (idx === -1) selectedSeats.push(seatId);
            else selectedSeats.splice(idx, 1);
            loadSeats();
        };

        window.holdSelectedSeats = async function(eventId) {
            if (selectedSeats.length === 0) return;
            if (!token) return alert('Please login first');
            try {
                await api(`/api/events/${eventId}/hold-bulk`, 'POST', { seat_ids: selectedSeats });
                alert('Seats held! You have 10 minutes to confirm.');
                selectedSeats = [];
                loadSeats();
            } catch (e) { alert(e.message); }
        };

        window.confirmHeldSeats = async function(eventId) {
            try {
                await api(`/api/events/${eventId}/confirm-held`, 'POST');
                alert('Booking Confirmed!');
                window.location.hash = '#my-bookings';
            } catch (e) { alert(e.message); }
        };

        window.holdSeat = async function(eventId, seatId, status) {
            if (status !== 'available') return;
            if (!token) return alert('Please login first');
            try {
                await api(`/api/events/${eventId}/seats/${seatId}/hold`, 'POST');
                alert('Seat held! You have 10 minutes to confirm.');
                // Add confirm button
                document.getElementById('actions').innerHTML = `<button onclick="confirmSeat(${eventId}, '${seatId}')">Confirm Booking for ${seatId}</button>`;
            } catch (e) { alert(e.message); }
        };

        window.confirmSeat = async function(eventId, seatId) {
            try {
                await api(`/api/events/${eventId}/seats/${seatId}/confirm`, 'POST');
                alert('Booking Confirmed!');
                window.location.hash = '#my-bookings';
            } catch (e) { alert(e.message); }
        };

        function renderAuth(isLogin) {
            app.innerHTML = `<div class='auth-container card'>
                <div style="text-align:center; margin-bottom:28px;">
                    <div style="font-size:36px; margin-bottom:12px;">${isLogin ? '🔑' : '🎫'}</div>
                    <h2 style="margin:0 0 6px;">${isLogin ? 'Welcome Back' : 'Create Account'}</h2>
                    <p style="margin:0; color:var(--text-light); font-size:14px;">${isLogin ? 'Sign in to access your bookings' : 'Join to start booking events'}</p>
                </div>
                <form id="auth-form" onsubmit="event.preventDefault(); authSubmit(${isLogin});">
                    <input id="email" type="email" placeholder="Email address" required>
                    <input id="password" type="password" placeholder="Password" required>
                    ${!isLogin ? '<select id="role"><option value="customer">Customer</option><option value="organiser">Organiser</option></select>' : ''}
                    <button type="submit" style="margin-top:4px;">${isLogin ? 'Login' : 'Register'}</button>
                </form>
                <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-light);">
                    ${isLogin ? `Don't have an account? <a href="#register" style="color:var(--primary);">Register</a>` : `Already have an account? <a href="#login" style="color:var(--primary);">Login</a>`}
                </p>
            </div>`;
        }

        window.authSubmit = async function(isLogin) {
            email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const roleEl = document.getElementById('role');
            const userRole = roleEl ? roleEl.value : 'customer';
            try {
                if (isLogin) {
                    const res = await api('/api/login', 'POST', { email, password });
                    token = res.token; userId = res.user_id; role = res.role;
                    localStorage.setItem('token', token);
                    localStorage.setItem('email', email);
                    updateNav();
                    window.location.hash = '#events';
                } else {
                    await api('/api/register', 'POST', { email, password, role: userRole });
                    alert('Registered! Please log in.');
                    window.location.hash = '#login';
                }
            } catch (e) { alert(e.message); }
        }

        
        window.cancelBooking = async function(bookingId) {
            if (!confirm('Are you sure you want to cancel this booking?')) return;
            try {
                await api(`/api/me/bookings/${bookingId}/cancel`, 'POST');
                alert('Booking cancelled successfully.');
                renderMyBookings();
            } catch (e) {
                alert(e.message);
            }
        };

        
        let builderGrid = [];
        let builderRows = 5;
        let builderCols = 5;

        function renderAdmin() {
            if (role !== 'admin') return app.innerHTML = 'Access Denied';
            app.innerHTML = `<div class="card"><h2>Admin Panel</h2>
                <h3>Create Venue</h3>
                <form onsubmit="event.preventDefault(); submitNewVenue();">
                    <input id="venue-name" type="text" placeholder="Venue Name" required><br><br>
                    
                    <div style="background: var(--nav-bg); padding: 15px; border-radius: 8px;">
                        <h4>Visual Seat Builder</h4>
                        <label>Rows: <input type="number" id="v-rows" value="5" style="width: 60px;"></label>
                        <label>Cols: <input type="number" id="v-cols" value="5" style="width: 60px;"></label>
                        <button type="button" onclick="generateBuilderGrid()">Generate Grid</button>
                        <p><small>Click a seat to change its category: <b>Standard -> Premium -> VIP -> Disabled</b></small></p>
                        
                        <div id="builder-map" style="margin-top: 15px;"></div>
                    </div><br>

                    <button type="submit" style="background: #27ae60;">Save Venue</button>
                </form></div>`;
            generateBuilderGrid();
        }

        window.generateBuilderGrid = function() {
            builderRows = parseInt(document.getElementById('v-rows').value) || 5;
            builderCols = parseInt(document.getElementById('v-cols').value) || 5;
            builderGrid = [];
            let html = '<div class="screen-indicator">SCREEN</div>';
            html += `<div style="display:grid; grid-template-columns: repeat(${builderCols}, 48px); gap: 6px; justify-content: center;">`;
            
            for(let r=1; r<=builderRows; r++) {
                let rowData = [];
                for(let c=1; c<=builderCols; c++) {
                    const label = String.fromCharCode(64 + r) + c; // A1, B2...
                    rowData.push({ label, category: 'Standard', r, c, active: true });
                    html += `<div class="seat available" id="b-seat-${r}-${c}" onclick="toggleBuilderSeat(${r}, ${c})" title="${label}">S</div>`;
                }
                builderGrid.push(rowData);
            }
            html += '</div>';
            document.getElementById('builder-map').innerHTML = html;
        };

        window.toggleBuilderSeat = function(r, c) {
            const seat = builderGrid[r-1][c-1];
            const el = document.getElementById(`b-seat-${r}-${c}`);
            
            if (seat.category === 'Standard') {
                seat.category = 'Premium';
                el.innerText = 'P';
                el.className = 'seat held'; // Reusing yellow for premium
            } else if (seat.category === 'Premium') {
                seat.category = 'VIP';
                el.innerText = 'V';
                el.className = 'seat booked'; // Reusing red for VIP
            } else if (seat.category === 'VIP') {
                seat.active = false;
                seat.category = 'Disabled';
                el.innerText = 'X';
                el.style.background = '#334155';
                el.style.borderColor = '#475569';
                el.style.color = '#64748b';
            } else {
                seat.active = true;
                seat.category = 'Standard';
                el.innerText = 'S';
                el.className = 'seat available';
                el.style.background = '';
                el.style.borderColor = '';
            }
        };

        window.submitNewVenue = async function() {
            try {
                const name = document.getElementById('venue-name').value;
                const seats = [];
                
                builderGrid.forEach(row => {
                    row.forEach(s => {
                        if (s.active) {
                            seats.push({
                                seat_label: s.label,
                                category: s.category,
                                row_number: s.r,
                                column_number: s.c
                            });
                        }
                    });
                });
                
                if (seats.length === 0) return alert('Cannot create a venue with 0 seats!');

                await api('/api/venues', 'POST', { name, seats });
                alert('Venue Created with ' + seats.length + ' seats!');
                document.getElementById('venue-name').value = '';
                generateBuilderGrid();
            } catch (e) { alert(e.message); }
        };

        function renderOrganiser() {
            if (role !== 'organiser' && role !== 'admin') return app.innerHTML = 'Access Denied';
            app.innerHTML = `<div class="panel-split"><div class="card"><h2>Organiser Panel</h2>
                <h3>Create Event</h3>
                <form onsubmit="event.preventDefault(); submitNewEvent();">
                    <select id="ev-venue-id" required><option value="">Loading Venues...</option></select><br><br>
                    <input id="ev-title" type="text" placeholder="Title" required><br><br>
                    <select id="ev-type"><option value="movie">Movie</option><option value="concert">Concert</option></select><br><br>
                    <input id="ev-starts" type="datetime-local" required><br><br>
                    <label style="color:var(--text-light);display:block;margin-bottom:8px;">Poster Image (Optional)</label>
                    <input id="ev-poster" type="file" accept="image/jpeg, image/png, image/webp" style="margin-bottom:20px;"><br>
                    <textarea id="ev-prices" placeholder='[{"category": "Standard", "price_cents": 1000}, {"category": "Premium", "price_cents": 2000}]' rows="3" style="width: 100%;"></textarea><br><br>
                    <button type="submit">Create Event</button>
                </form>
                </div><div class="card"><h3>Event Summary</h3>
                <select id="sum-event-id"><option value="">Select Event...</option></select>
                <button onclick="loadSummary()">Load Summary</button>
                <div id="summary-result" style="margin-top: 15px; font-size: 1.1em; line-height: 1.6;"></div>
                </div></div>
            `;
            api('/api/venues').then(data => {
                const select = document.getElementById('ev-venue-id');
                if (data.venues && data.venues.length > 0) {
                    select.innerHTML = data.venues.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
                } else {
                    select.innerHTML = '<option value="">No Venues Available</option>';
                }
            });
            api('/api/events').then(data => {
                const select = document.getElementById('sum-event-id');
                if (data.events && data.events.length > 0) {
                    const filtered = role === 'admin' ? data.events : data.events.filter(e => e.organiser_id == userId);
                    select.innerHTML = '<option value="">Select Event...</option>' + filtered.map(e => `<option value="${e.id}">Event ${e.id}: ${e.title}</option>`).join('');
                }
            });
        }

        window.submitNewEvent = async function() {
            try {
                const venue_id = parseInt(document.getElementById('ev-venue-id').value);
                const title = document.getElementById('ev-title').value;
                const event_type = document.getElementById('ev-type').value;
                const starts_at = document.getElementById('ev-starts').value;
                const prices = JSON.parse(document.getElementById('ev-prices').value || '[]');
                
                const eventRes = await api('/api/events', 'POST', { venue_id, title, event_type, starts_at, prices });
                
                const posterFile = document.getElementById('ev-poster').files[0];
                if (posterFile && eventRes && eventRes.event_id) {
                    const headers = {};
                    if (token) headers['Authorization'] = 'Bearer ' + token;
                    headers['Content-Type'] = posterFile.type;
                    
                    const uploadRes = await fetch(`/api/events/${eventRes.event_id}/poster`, {
                        method: 'POST',
                        headers: headers,
                        body: posterFile
                    });
                    
                    if (!uploadRes.ok) {
                        alert('Event created, but poster upload failed: ' + await uploadRes.text());
                        return;
                    }
                }
                
                alert('Event Created!');
            } catch (e) { alert(e.message); }
        };

        window.loadSummary = async function() {
            try {
                const id = document.getElementById('sum-event-id').value;
                if (!id) return;
                const data = await api(`/api/events/${id}/summary`);
                document.getElementById('summary-result').innerHTML = `
                    <p>Total Revenue: $${data.total_revenue_cents / 100}</p>
                    <p>Available: ${data.seat_counts.available || 0}</p>
                    <p>Held: ${data.seat_counts.held || 0}</p>
                    <p>Booked: ${data.seat_counts.booked || 0}</p>
                    <p>Total Seats: ${data.total_seats}</p>
                `;
            } catch (e) { alert(e.message); }
        };

        function renderMyBookings() {
            app.innerHTML = `<div class="card"><h2>My Bookings</h2><div id="bookings-list">Loading...</div></div>`;
            api('/api/me/bookings').then(data => {
                if (!data.bookings || data.bookings.length === 0) {
                    document.getElementById('bookings-list').innerHTML = `
                        <div style="text-align:center; padding: 40px 20px; color: var(--text-light);">
                            <div style="font-size:48px; margin-bottom:16px;">🎟️</div>
                            <p style="font-size:16px; margin:0;">No bookings yet — <a href="#events" style="color:var(--primary);">browse events</a> to get started!</p>
                        </div>`;
                    return;
                }
                const statusColor = { confirmed: '#10b981', pending: '#f59e0b', cancelled: '#ef4444' };
                const list = data.bookings.map(b => `<div class="booking-card">
                    ${b.poster_url ? `<img src="${b.poster_url}" alt="${b.event_title} poster" class="poster-thumb">` : `<div class="poster-placeholder" style="display:flex;align-items:center;justify-content:center;">🎬</div>`}
                    <div style="flex:1; min-width:0;">
                        <h3 style="margin:0 0 6px; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${b.event_title}</h3>
                        <p style="margin:0 0 8px; font-size:13px; color:var(--text-light);">Ref: <code style="background:#0f172a; padding:2px 6px; border-radius:4px; font-size:12px;">${b.booking_reference}</code></p>
                        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                            <span style="display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; color:${statusColor[b.status] || '#94a3b8'};">
                                <span style="width:8px;height:8px;border-radius:50%;background:${statusColor[b.status] || '#94a3b8'};display:inline-block;"></span>
                                ${b.status.charAt(0).toUpperCase() + b.status.slice(1)}
                            </span>
                            <span style="font-size:13px; color:var(--text-light);">Total: <strong style="color:#fff;">$${(b.total_cents/100).toFixed(2)}</strong></span>
                        </div>
                    </div>
                    ${b.status === 'confirmed' ? `<button onclick="cancelBooking(${b.id})" class="danger" style="width:auto; flex-shrink:0;">Cancel</button>` : ''}
                </div>`).join('');
                document.getElementById('bookings-list').innerHTML = list;
            }).catch(e => { document.getElementById('bookings-list').innerHTML = `<p class="error">${e.message}</p>`; });
        }


        
        async function renderWaitlistAccept(queryStr) {
            app.innerHTML = '<div class="card"><h2>Waitlist Offer</h2><p>Processing your waitlist offer...</p></div>';
            const params = new URLSearchParams(queryStr);
            const eventId = params.get('event_id');
            const tokenStr = params.get('token');
            if (!eventId || !tokenStr) {
                app.innerHTML = '<div class="card"><h2>Error</h2><p class="error">Invalid link.</p></div>';
                return;
            }
            if (!token) {
                alert('Please login to claim your waitlist ticket.');
                window.location.hash = '#login';
                return;
            }
            try {
                const res = await api(`/api/events/${eventId}/waitlist/${tokenStr}/accept`, 'POST');
                app.innerHTML = `<div class="card"><h2>Success!</h2><p>Your waitlist ticket has been claimed! Booking reference: ${res.booking_reference || 'Confirmed'}</p><button onclick="window.location.hash='#my-bookings'">View My Bookings</button></div>`;
            } catch (e) {
                app.innerHTML = `<div class="card"><h2>Error</h2><p class="error">${e.message}</p></div>`;
            }
        }

        function router() {
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            updateNav();
            const hash = window.location.hash || '#events';
            if (hash === '#events') renderEvents();
            else if (hash.startsWith('#event-')) renderEventSeats(hash.split('-')[1]);
            else if (hash === '#login') renderAuth(true);
            else if (hash === '#register') renderAuth(false);
            else if (hash === '#my-bookings') renderMyBookings();

            else if (hash === '#admin') renderAdmin();
                        else if (hash === '#organiser') renderOrganiser();
            else if (hash.startsWith('#waitlist-accept?')) renderWaitlistAccept(hash.split('?')[1]);

        }

        window.addEventListener('hashchange', router);
        router();
    </script>
</body>
</html>
